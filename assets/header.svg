<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508"/>
      <stop offset="50%" stop-color="#090c13"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>

    <radialGradient id="moon-radial" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e8ecf4"/>
      <stop offset="85%" stop-color="#a4b3ca"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <radialGradient id="nebula-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#8ba3c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyber-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="moon-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>

    <pattern id="dot-matrix" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
  <![CDATA[
    /* Reset and Base */
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'JetBrains Mono', 'Fira Code', monospace;
      user-select: none;
    }

    /* Keyframes */
    @keyframes pulseMoonGlow {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.025); }
    }

    @keyframes floatFrame1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2.5deg); }
    }

    @keyframes floatFrame2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-3deg); }
    }

    @keyframes floatFrame3 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(1.5deg); }
    }

    @keyframes driftClouds {
      0% { transform: translateX(0px); }
      50% { transform: translateX(25px); }
      100% { transform: translateX(0px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    @keyframes scanlineMove {
      0% { transform: translateY(-340px); }
      100% { transform: translateY(340px); }
    }

    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes glitchGlitch {
      0%, 92%, 100% { transform: translate(0, 0); opacity: 0; }
      93% { transform: translate(-3px, 1px); opacity: 0.7; }
      95% { transform: translate(3px, -1px); opacity: 0.8; }
      97% { transform: translate(-1px, 2px); opacity: 0.4; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes waveBar {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
    }

    @keyframes portalSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Animation Classes */
    .moon-halo-anim {
      transform-origin: 710px 140px;
      animation: pulseMoonGlow 7s ease-in-out infinite;
    }

    .frame-box-1 {
      transform-origin: 640px 170px;
      animation: floatFrame1 6.5s ease-in-out infinite;
    }

    .frame-box-2 {
      transform-origin: 770px 220px;
      animation: floatFrame2 8s ease-in-out infinite;
    }

    .frame-box-3 {
      transform-origin: 730px 90px;
      animation: floatFrame3 5.5s ease-in-out infinite;
    }

    .cloud-drift {
      animation: driftClouds 16s ease-in-out infinite;
    }

    .star-t1 { animation: twinkle 3s ease-in-out infinite; transform-origin: 200px 80px; }
    .star-t2 { animation: twinkle 4.2s ease-in-out infinite 1s; transform-origin: 550px 50px; }
    .star-t3 { animation: twinkle 2.6s ease-in-out infinite 1.8s; transform-origin: 820px 70px; }
    .star-t4 { animation: twinkle 3.7s ease-in-out infinite 0.5s; transform-origin: 400px 130px; }

    .scan-laser {
      animation: scanlineMove 8s linear infinite;
    }

    .glitch-layer-1 {
      animation: glitchGlitch 4.5s step-end infinite;
    }

    .cursor {
      animation: cursorBlink 1.1s infinite;
    }

    .radar-beam {
      transform-origin: 105px 265px;
      animation: radarSweep 5s linear infinite;
    }

    .wb-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; transform-origin: bottom; }
    .wb-2 { animation: waveBar 1.4s ease-in-out infinite 0.3s; transform-origin: bottom; }
    .wb-3 { animation: waveBar 0.9s ease-in-out infinite 0.2s; transform-origin: bottom; }
    .wb-4 { animation: waveBar 1.6s ease-in-out infinite 0.5s; transform-origin: bottom; }
    .wb-5 { animation: waveBar 1.1s ease-in-out infinite 0.15s; transform-origin: bottom; }
    .wb-6 { animation: waveBar 1.3s ease-in-out infinite 0.4s; transform-origin: bottom; }
  ]]>
  </style>

  <!-- Background Layer -->
  <rect width="900" height="340" fill="url(#bg-grad)"/>
  <rect width="900" height="340" fill="url(#grid-pattern)"/>

  <!-- Light Speed Horizon / Cyber Floor Projection -->
  <g opacity="0.45">
    <line x1="0" y1="285" x2="900" y2="285" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3, 4" stroke-opacity="0.3"/>
    <line x1="0" y1="286" x2="900" y2="286" stroke="url(#cyber-line-grad)" stroke-width="1.2"/>
    <polygon points="0,340 200,285 700,285 900,340" fill="url(#beam-grad)"/>
  </g>

  <!-- Stars Layer -->
  <g fill="#ffffff">
    <circle cx="85" cy="45" r="0.9" opacity="0.6"/>
    <circle cx="160" cy="95" r="0.6" opacity="0.4"/>
    <circle cx="200" cy="80" r="1.3" class="star-t1" filter="url(#soft-glow)"/>
    <circle cx="280" cy="35" r="0.8" opacity="0.5"/>
    <circle cx="340" cy="110" r="0.7" opacity="0.3"/>
    <circle cx="400" cy="130" r="1.1" class="star-t4"/>
    <circle cx="490" cy="40" r="0.7" opacity="0.45"/>
    <circle cx="550" cy="50" r="1.4" class="star-t2" filter="url(#soft-glow)"/>
    <circle cx="610" cy="100" r="0.8" opacity="0.5"/>
    <circle cx="670" cy="40" r="0.6" opacity="0.4"/>
    <circle cx="790" cy="115" r="0.8" opacity="0.5"/>
    <circle cx="820" cy="70" r="1.3" class="star-t3" filter="url(#soft-glow)"/>
    <circle cx="860" cy="140" r="0.6" opacity="0.3"/>
  </g>

  <!-- Constellation Accent Lines -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="2,3" fill="none">
    <polyline points="160,95 200,80 280,35"/>
    <polyline points="550,50 610,100 670,40"/>
  </g>

  <!-- Nebula Ethereal Glow -->
  <circle cx="710" cy="140" r="170" fill="url(#nebula-glow)"/>
  <circle cx="450" cy="170" r="240" fill="url(#nebula-glow)" opacity="0.5"/>

  <!-- Anime Manga Cloud Shapes (Inspired by Image 3) -->
  <g class="cloud-drift" fill="#ffffff" opacity="0.07">
    <!-- Stylized cloud billows behind moon -->
    <path d="M580,240 C595,210 630,205 650,220 C675,190 720,185 750,210 C780,180 830,195 845,230 C865,235 880,250 880,270 L550,270 C550,250 565,242 580,240 Z"/>
    <path d="M620,265 C640,245 670,245 685,255 C705,235 745,230 770,250 C790,230 830,235 845,265 Z" opacity="0.5"/>
  </g>

  <!-- ================= CELESTIAL MOON (Inspired by Image 3) ================= -->
  <g transform="translate(690, 130)">
    <!-- Aura Glow Ring -->
    <circle cx="20" cy="10" r="75" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4,8" opacity="0.2" class="moon-halo-anim"/>
    <circle cx="20" cy="10" r="88" fill="none" stroke="#a4b3ca" stroke-width="0.5" stroke-dasharray="2,12" opacity="0.3"/>

    <!-- Crescent Moon Outer Glow -->
    <path d="M 45 -65 A 80 80 0 1 0 55 85 A 66 66 0 1 1 45 -65 Z"
          fill="#ffffff"
          opacity="0.3"
          filter="url(#moon-halo)"
          class="moon-halo-anim"/>

    <!-- Crescent Moon Core Body -->
    <path d="M 45 -65 A 80 80 0 1 0 55 85 A 66 66 0 1 1 45 -65 Z"
          fill="url(#moon-radial)"
          filter="url(#soft-glow)"/>

    <!-- Moon Texture / Crater accents -->
    <g fill="#475569" opacity="0.35">
      <circle cx="-35" cy="5" r="6"/>
      <circle cx="-42" cy="-22" r="4.5"/>
      <circle cx="-15" cy="38" r="5"/>
      <circle cx="-48" cy="18" r="3.5"/>
      <circle cx="-25" cy="-45" r="4"/>
    </g>

    <!-- Digital crosshair on moon axis -->
    <line x1="-75" y1="10" x2="-65" y2="10" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <line x1="20" y1="-85" x2="20" y2="-75" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- ================= FLOATING GEOMETRIC FRAMES (Inspired by Image 3) ================= -->
  <!-- Frame 1: Center-Left Large Square Frame -->
  <g class="frame-box-1">
    <rect x="610" y="140" width="58" height="58" fill="none" stroke="#ffffff" stroke-width="1.8" filter="url(#soft-glow)"/>
    <rect x="618" y="148" width="42" height="42" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="3, 2" opacity="0.7"/>
    <!-- Corner brackets -->
    <path d="M605,145 L605,135 L615,135" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <path d="M673,193 L673,203 L663,203" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <!-- Coordinate tag -->
    <text x="612" y="132" font-size="7.5" fill="#ffffff" letter-spacing="1" opacity="0.75" font-family="'JetBrains Mono', monospace">NODE_01</text>
  </g>

  <!-- Frame 2: Bottom-Right Medium Frame -->
  <g class="frame-box-2">
    <rect x="745" y="195" width="44" height="44" fill="none" stroke="#e2e8f0" stroke-width="1.6" filter="url(#soft-glow)"/>
    <rect x="751" y="201" width="32" height="32" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
    <circle cx="767" cy="217" r="2.5" fill="#ffffff" opacity="0.8"/>
    <text x="746" y="248" font-size="6.5" fill="#a4b3ca" letter-spacing="1" font-family="'JetBrains Mono', monospace">AXIS::77</text>
  </g>

  <!-- Frame 3: Upper-Right Small Accent Frame -->
  <g class="frame-box-3">
    <rect x="710" y="65" width="34" height="34" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
    <line x1="710" y1="82" x2="744" y2="82" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="2, 2" opacity="0.5"/>
    <line x1="727" y1="65" x2="727" y2="99" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="2, 2" opacity="0.5"/>
  </g>

  <!-- Frame 4: Tiny Distant Floating Cube -->
  <g transform="translate(805, 120) rotate(18)">
    <rect x="0" y="0" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
  </g>
  <g transform="translate(565, 185) rotate(-12)">
    <rect x="0" y="0" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Ink Splash / Manga Specks (Image 2 & 3 aesthetic) -->
  <g fill="#ffffff" opacity="0.65">
    <rect x="670" y="125" width="2" height="2"/>
    <rect x="675" y="120" width="1.5" height="1.5"/>
    <rect x="702" y="180" width="2.5" height="2.5"/>
    <rect x="600" y="170" width="1.5" height="3"/>
    <rect x="735" y="150" width="3" height="1.5"/>
    <rect x="780" y="175" width="2" height="2"/>
    <rect x="635" y="115" width="1.5" height="1.5"/>
  </g>

  <!-- ================= LEFT HERO: BRANDING & HUD (Inspired by Image 1) ================= -->
  <!-- Top Telemetry Status Line -->
  <g transform="translate(48, 55)">
    <!-- Pulsing Live Dot -->
    <circle cx="4" cy="4" r="3.5" fill="#ffffff" filter="url(#soft-glow)"/>
    <circle cx="4" cy="4" r="7" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.4"/>
    <text x="18" y="7" font-size="9" fill="#e2e8f0" font-weight="700" letter-spacing="2.5">CORE.PROTOCOL // RE-001</text>
    <text x="235" y="7" font-size="8.5" fill="#64748b" letter-spacing="1.8">ID: 0xHYZEN</text>
    <text x="325" y="7" font-size="8.5" fill="#64748b" letter-spacing="1.8">STABLE_RELEASE</text>
  </g>

  <!-- Corner Brackets for Hero Title -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.55" fill="none">
    <path d="M 45,78 L 45,70 L 60,70"/>
    <path d="M 480,70 L 495,70 L 495,78"/>
    <path d="M 45,215 L 45,223 L 60,223"/>
    <path d="M 480,223 L 495,223 L 495,215"/>
  </g>

  <!-- Dynamic Glitch Layer (Shadow Behind) -->
  <text x="49" y="148" font-size="56" font-weight="900" fill="#a4b3ca" letter-spacing="6" class="glitch-layer-1" font-family="'JetBrains Mono', 'Segoe UI', sans-serif">
    HYZENVAL
  </text>

  <!-- Main Hero Title -->
  <text x="48" y="148" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#soft-glow)" font-family="'JetBrains Mono', 'Segoe UI', sans-serif">
    HYZENVAL
  </text>

  <!-- Subtitle Tagline with Japanese Cyber Kanopy / Manga Accent -->
  <g transform="translate(50, 178)">
    <rect x="0" y="-12" width="75" height="16" fill="#ffffff" fill-opacity="0.12" rx="2"/>
    <text x="6" y="0" font-size="8.5" font-weight="700" fill="#ffffff" letter-spacing="1.5">VOID ARCH</text>
    <text x="86" y="0" font-size="11.5" fill="#94a3b8" font-weight="500" letter-spacing="3.2">
      CREATIVE TECHNOLOGIST <tspan fill="#ffffff" font-weight="300">|</tspan> DEVELOPER
    </text>
  </g>

  <!-- Terminal Style Interactive Subtitle Prompt -->
  <g transform="translate(50, 208)">
    <text x="0" y="0" font-size="10.5" fill="#64748b" font-family="'JetBrains Mono', monospace">
      <tspan fill="#ffffff" font-weight="700">~</tspan>
      <tspan fill="#94a3b8"> /celestial/void </tspan>
      <tspan fill="#e2e8f0">$ run dream --infinite --precision=ultra</tspan>
      <tspan fill="#ffffff" class="cursor" font-weight="900">_</tspan>
    </text>
  </g>

  <!-- ================= BOTTOM TELEMETRY DOCK ================= -->
  <!-- Audio / Frequency Visualizer Wave Bars (Left) -->
  <g transform="translate(50, 274)">
    <rect x="0" y="-14" width="3" height="14" fill="#ffffff" class="wb-1" opacity="0.9"/>
    <rect x="6" y="-18" width="3" height="18" fill="#ffffff" class="wb-2" opacity="0.9"/>
    <rect x="12" y="-10" width="3" height="10" fill="#ffffff" class="wb-3" opacity="0.75"/>
    <rect x="18" y="-22" width="3" height="22" fill="#ffffff" class="wb-4" opacity="0.95"/>
    <rect x="24" y="-12" width="3" height="12" fill="#ffffff" class="wb-5" opacity="0.8"/>
    <rect x="30" y="-16" width="3" height="16" fill="#ffffff" class="wb-6" opacity="0.85"/>
    <rect x="36" y="-9" width="3" height="9" fill="#ffffff" class="wb-2" opacity="0.7"/>
    <rect x="42" y="-20" width="3" height="20" fill="#ffffff" class="wb-4" opacity="0.9"/>
    <rect x="48" y="-11" width="3" height="11" fill="#ffffff" class="wb-1" opacity="0.8"/>
    <rect x="54" y="-15" width="3" height="15" fill="#ffffff" class="wb-5" opacity="0.85"/>
    <text x="68" y="-3" font-size="8" fill="#64748b" letter-spacing="1.5" font-family="'JetBrains Mono', monospace">432.00 Hz // SYNC</text>
  </g>

  <!-- Mini Radar / Compass (Center-Left) -->
  <g transform="translate(230, 268)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2, 2" opacity="0.25"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="0.5" opacity="0.25"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffffff" stroke-width="0.5" opacity="0.25"/>
    <!-- Radar rotating beam -->
    <g class="radar-beam" transform-origin="0 0">
      <line x1="0" y1="0" x2="13" y2="-5" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
    </g>
    <!-- Blip -->
    <circle cx="6" cy="-4" r="1.5" fill="#ffffff" filter="url(#soft-glow)"/>
    <text x="24" y="3" font-size="8" fill="#64748b" letter-spacing="1.5" font-family="'JetBrains Mono', monospace">RADAR // ACTIVE</text>
  </g>

  <!-- Coordinate & Signature Tag (Right) -->
  <g transform="translate(710, 298)">
    <text x="0" y="0" font-size="8" fill="#64748b" letter-spacing="2" font-family="'JetBrains Mono', monospace">
      COORD 35°41'N 139°41'E
    </text>
    <text x="0" y="14" font-size="7.5" fill="#475569" letter-spacing="2" font-family="'JetBrains Mono', monospace">
      AFERA PROTOCOL // REV.XV
    </text>
  </g>

  <!-- Laser Scanline passing through banner -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" class="scan-laser" filter="url(#soft-glow)"/>

  <!-- Aesthetic Outer Border Framing -->
  <rect x="1.5" y="1.5" width="897" height="337" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" rx="6"/>
  <!-- Corner notch accents -->
  <line x1="12" y1="8" x2="28" y2="8" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
  <line x1="8" y1="12" x2="8" y2="28" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
  <line x1="888" y1="8" x2="872" y2="8" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
  <line x1="892" y1="12" x2="892" y2="28" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
  <line x1="12" y1="332" x2="28" y2="332" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
  <line x1="8" y1="328" x2="8" y2="312" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
  <line x1="888" y1="332" x2="872" y2="332" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
  <line x1="892" y1="328" x2="892" y2="312" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
</svg>
