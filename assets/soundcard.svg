<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <filter id="sc-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace;
      user-select: none;
    }
    @keyframes barPulse {
      0%, 100% { height: 4px; }
      50% { height: 26px; }
    }
    @keyframes playProgress {
      0% { width: 10px; }
      100% { width: 310px; }
    }
    .b1 { animation: barPulse 1.1s ease-in-out infinite 0.1s; }
    .b2 { animation: barPulse 0.9s ease-in-out infinite 0.3s; }
    .b3 { animation: barPulse 1.4s ease-in-out infinite 0.05s; }
    .b4 { animation: barPulse 1.2s ease-in-out infinite 0.4s; }
    .b5 { animation: barPulse 0.8s ease-in-out infinite 0.25s; }
    .b6 { animation: barPulse 1.5s ease-in-out infinite 0.15s; }
    .prog { animation: playProgress 45s linear infinite; }
  </style>

  <!-- Container -->
  <rect width="440" height="90" fill="url(#sc-bg)" rx="6" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.12"/>

  <!-- Album Art Placeholder / Vinyl Frame -->
  <g transform="translate(14, 14)">
    <rect width="62" height="62" fill="#000000" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25" rx="4"/>
    <circle cx="31" cy="31" r="22" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.2"/>
    <circle cx="31" cy="31" r="14" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35"/>
    <circle cx="31" cy="31" r="6" fill="#ffffff" opacity="0.9" filter="url(#sc-glow)"/>
  </g>

  <!-- Track Meta -->
  <g transform="translate(90, 26)">
    <text x="0" y="0" font-size="7.5" fill="#64748b" letter-spacing="1.5">NOW RESONATING // 432 Hz</text>
    <text x="0" y="15" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.2">VOIDS &amp; CONSTELLATIONS</text>
    <text x="0" y="28" font-size="8.5" fill="#94a3b8" letter-spacing="0.8">AFERA XV • HYZENVAL</text>
  </g>

  <!-- Animated Sound Bars (Upper Right) -->
  <g transform="translate(370, 42)">
    <rect x="0" y="-13" width="3" height="12" fill="#ffffff" rx="1.5" class="b1"/>
    <rect x="6" y="-13" width="3" height="18" fill="#ffffff" rx="1.5" class="b2"/>
    <rect x="12" y="-13" width="3" height="24" fill="#ffffff" rx="1.5" class="b3"/>
    <rect x="18" y="-13" width="3" height="15" fill="#ffffff" rx="1.5" class="b4"/>
    <rect x="24" y="-13" width="3" height="20" fill="#ffffff" rx="1.5" class="b5"/>
    <rect x="30" y="-13" width="3" height="10" fill="#ffffff" rx="1.5" class="b6"/>
  </g>

  <!-- Scrub Bar -->
  <g transform="translate(90, 68)">
    <rect x="0" y="0" width="330" height="3" fill="#1e293b" rx="1.5"/>
    <rect x="0" y="0" width="180" height="3" fill="#ffffff" rx="1.5" class="prog" filter="url(#sc-glow)"/>
    <text x="330" y="-4" font-size="7" fill="#64748b" text-anchor="end" font-family="'JetBrains Mono', monospace">02:44 / 04:32</text>
  </g>
</svg>

