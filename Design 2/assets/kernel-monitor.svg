<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="100%">
  <defs>
    <linearGradient id="km-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060204"/>
      <stop offset="50%" stop-color="#0b0407"/>
      <stop offset="100%" stop-color="#060204"/>
    </linearGradient>

    <linearGradient id="km-bar-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="70%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <filter id="km-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="km-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#be123c" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <style>
  <![CDATA[
    text {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      user-select: none;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.18); opacity: 0.85; }
    }

    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinWheelRev {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes blinkLive {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .p-ring { transform-origin: 80px 85px; animation: pulseRing 3s ease-in-out infinite; }
    .w-spin { transform-origin: 80px 85px; animation: spinWheel 16s linear infinite; }
    .w-rev { transform-origin: 80px 85px; animation: spinWheelRev 10s linear infinite; }
    .blink-red { animation: blinkLive 1.4s infinite; }
  ]]>
  </style>

  <!-- Container -->
  <rect width="920" height="170" fill="url(#km-bg)" rx="6"/>
  <rect width="920" height="170" fill="url(#km-dots)" rx="6"/>
  <rect width="918" height="168" x="1" y="1" fill="none" stroke="#e11d48" stroke-width="0.8" stroke-opacity="0.25" rx="6"/>

  <!-- Left: Execution Core Reactor -->
  <g transform="translate(15, 0)">
    <circle cx="80" cy="85" r="52" fill="none" stroke="#4c0519" stroke-width="0.8"/>
    <circle cx="80" cy="85" r="42" fill="none" stroke="#be123c" stroke-width="1" stroke-dasharray="6, 6" class="w-spin"/>
    <circle cx="80" cy="85" r="30" fill="none" stroke="#fda4af" stroke-width="1.2" stroke-dasharray="16, 8" class="w-rev"/>
    <circle cx="80" cy="85" r="16" fill="#170308" stroke="#e11d48" stroke-width="1.6" filter="url(#km-glow)"/>
    <circle cx="80" cy="85" r="5" fill="#ffffff" class="blink-red" filter="url(#km-glow)"/>

    <g class="w-spin">
      <circle cx="80" cy="43" r="2.5" fill="#e11d48" filter="url(#km-glow)"/>
    </g>

    <text x="80" y="152" font-size="7.5" fill="#fda4af" text-anchor="middle" letter-spacing="1.5">KERNEL CLOCK // 4.8 GHz</text>
  </g>

  <!-- Divider 1 -->
  <line x1="185" y1="20" x2="185" y2="150" stroke="#be123c" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="4, 3"/>

  <!-- Center: Instruction Pipeline & Stack Gauges -->
  <g transform="translate(205, 26)">
    <text x="0" y="6" font-size="8.5" fill="#fda4af" font-weight="700" letter-spacing="2">PIPELINE EXECUTION STATUS</text>
    <text x="375" y="6" font-size="7.5" fill="#881337" letter-spacing="1">ARCH: x86_64 // SIMD</text>

    <!-- Gauge 1: L1 Cache & Instructions -->
    <g transform="translate(0, 24)">
      <text x="0" y="7" font-size="8" fill="#e2e8f0" letter-spacing="1">L1/L2 MEMORY BUS LOAD</text>
      <text x="395" y="7" font-size="8" fill="#fda4af" text-anchor="end" font-weight="700">97.2%</text>
      <rect x="0" y="12" width="395" height="4" fill="#1c070c" rx="2"/>
      <rect x="0" y="12" width="384" height="4" fill="url(#km-bar-red)" rx="2"/>
    </g>

    <!-- Gauge 2: Thread Pool Throughput -->
    <g transform="translate(0, 52)">
      <text x="0" y="7" font-size="8" fill="#e2e8f0" letter-spacing="1">CONCURRENCY &amp; ASYNC WORKERS</text>
      <text x="395" y="7" font-size="8" fill="#fda4af" text-anchor="end" font-weight="700">94.8%</text>
      <rect x="0" y="12" width="395" height="4" fill="#1c070c" rx="2"/>
      <rect x="0" y="12" width="374" height="4" fill="url(#km-bar-red)" rx="2"/>
    </g>

    <!-- Gauge 3: GPU Shader Rasterizer -->
    <g transform="translate(0, 80)">
      <text x="0" y="7" font-size="8" fill="#e2e8f0" letter-spacing="1">GRAPHICS &amp; COMPUTE SHADERS</text>
      <text x="395" y="7" font-size="8" fill="#fda4af" text-anchor="end" font-weight="700">91.4%</text>
      <rect x="0" y="12" width="395" height="4" fill="#1c070c" rx="2"/>
      <rect x="0" y="12" width="361" height="4" fill="url(#km-bar-red)" rx="2"/>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="635" y1="20" x2="635" y2="150" stroke="#be123c" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="4, 3"/>

  <!-- Right: Active Kernel Threads & Stack Frame -->
  <g transform="translate(655, 26)">
    <text x="0" y="6" font-size="8.5" fill="#fda4af" font-weight="700" letter-spacing="2">ACTIVE SUBROUTINES</text>

    <!-- Thread Box -->
    <rect x="0" y="18" width="245" height="48" fill="#120408" stroke="#be123c" stroke-width="0.8" stroke-opacity="0.3" rx="4"/>
    <circle cx="14" cy="36" r="3" fill="#e11d48" class="blink-red" filter="url(#km-glow)"/>
    <text x="24" y="34" font-size="8" fill="#ffffff" font-weight="700" letter-spacing="1">PID 0x01: SYSTEM_SYNAPSE</text>
    <text x="24" y="50" font-size="7" fill="#fda4af" letter-spacing="0.8">STATE: UNINTERRUPTIBLE_SLEEP</text>

    <!-- Hex Register Footer -->
    <g transform="translate(0, 88)">
      <text x="0" y="0" font-size="7.5" fill="#fda4af" letter-spacing="1.2">FRAME PTR: 0x7FFFEE00</text>
      <text x="0" y="14" font-size="7" fill="#881337" letter-spacing="1">INTERRUPT VECTOR: IRQ_0x00FF</text>
      <text x="245" y="14" font-size="7" fill="#e11d48" text-anchor="end" font-weight="700" letter-spacing="1">ONLINE ●</text>
    </g>
  </g>
</svg>
