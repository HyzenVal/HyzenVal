<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 26" width="100%" height="26">
  <defs>
    <linearGradient id="c-div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0"/>
      <stop offset="20%" stop-color="#be123c" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#be123c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
    <filter id="c-div-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
  <![CDATA[
    @keyframes pulseDiamond {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 8px #e11d48); }
    }
    .c-dia {
      transform-origin: 460px 13px;
      animation: pulseDiamond 2.5s ease-in-out infinite;
    }
  ]]>
  </style>

  <!-- Glowing Laser Line -->
  <line x1="60" y1="13" x2="860" y2="13" stroke="url(#c-div-grad)" stroke-width="1.2"/>

  <!-- Secondary Memory Ticks -->
  <line x1="380" y1="8" x2="380" y2="18" stroke="#be123c" stroke-width="0.8" opacity="0.6"/>
  <line x1="540" y1="8" x2="540" y2="18" stroke="#be123c" stroke-width="0.8" opacity="0.6"/>

  <!-- Center Diamond Portal Node -->
  <g class="c-dia">
    <rect x="454" y="7" width="12" height="12" transform="rotate(45 460 13)" fill="#1c070c" stroke="#e11d48" stroke-width="1.4" filter="url(#c-div-glow)"/>
    <circle cx="460" cy="13" r="2" fill="#ffffff"/>
  </g>

  <!-- Left / Right Geometric brackets -->
  <polygon points="50,13 40,9 40,17" fill="#e11d48" opacity="0.6"/>
  <polygon points="870,13 880,9 880,17" fill="#e11d48" opacity="0.6"/>
</svg>
