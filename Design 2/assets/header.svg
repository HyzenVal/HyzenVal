<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="d2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050305"/>
      <stop offset="45%" stop-color="#0a0508"/>
      <stop offset="75%" stop-color="#040204"/>
      <stop offset="100%" stop-color="#020103"/>
    </linearGradient>

    <!-- Deep Crimson Nebula / Glow -->
    <radialGradient id="crimson-nebula" cx="72%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#881337" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#4c0519" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blood-moon-grad" cx="42%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fecdd3"/>
      <stop offset="75%" stop-color="#fda4af"/>
      <stop offset="92%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <linearGradient id="laser-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e11d48" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#e11d48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bar-crimson" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="crimson-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="white-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patterns -->
    <pattern id="d2-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.03"/>
    </pattern>

    <pattern id="hex-dot-matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#be123c" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <style>
  <![CDATA[
    text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      user-select: none;
    }

    /* Keyframes */
    @keyframes bloodMoonPulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 16px #e11d48); }
    }

    @keyframes floatCube1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(3deg); }
    }

    @keyframes floatCube2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(16px) rotate(-4deg); }
    }

    @keyframes floatCube3 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    @keyframes glitchRed {
      0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
      91% { transform: translate(-4px, 1px); opacity: 0.85; }
      93% { transform: translate(4px, -2px); opacity: 0.9; }
      95% { transform: translate(-2px, 3px); opacity: 0.5; }
      97% { transform: translate(2px, -1px); opacity: 0.7; }
    }

    @keyframes scanlineSweep {
      0% { transform: translateY(-350px); }
      100% { transform: translateY(350px); }
    }

    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes terminalCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes starPulse {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.4); }
    }

    @keyframes emberDrift {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translate(-25px, -65px); opacity: 0; }
    }

    @keyframes codeStream {
      0% { transform: translateY(0); }
      100% { transform: translateY(-28px); }
    }

    @keyframes barEq {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
    }

    /* Classes */
    .moon-core {
      transform-origin: 720px 145px;
      animation: bloodMoonPulse 6s ease-in-out infinite;
    }

    .cube-1 {
      transform-origin: 640px 180px;
      animation: floatCube1 7s ease-in-out infinite;
    }

    .cube-2 {
      transform-origin: 790px 225px;
      animation: floatCube2 8.5s ease-in-out infinite;
    }

    .cube-3 {
      transform-origin: 755px 85px;
      animation: floatCube3 6s ease-in-out infinite;
    }

    .glitch-red-shadow {
      animation: glitchRed 3.8s step-end infinite;
    }

    .scan-beam {
      animation: scanlineSweep 7s linear infinite;
    }

    .radar-rot {
      transform-origin: 85px 290px;
      animation: radarSpin 4.5s linear infinite;
    }

    .term-cursor {
      animation: terminalCursor 1s infinite;
    }

    .star-a { animation: starPulse 2.8s ease-in-out infinite; }
    .star-b { animation: starPulse 4.2s ease-in-out infinite 1.2s; }
    .star-c { animation: starPulse 3.1s ease-in-out infinite 2s; }

    .ember-1 { animation: emberDrift 4s ease-out infinite 0.2s; }
    .ember-2 { animation: emberDrift 5s ease-out infinite 1.5s; }
    .ember-3 { animation: emberDrift 3.5s ease-out infinite 0.8s; }

    .eq-1 { animation: barEq 1.1s ease-in-out infinite 0.1s; transform-origin: bottom; }
    .eq-2 { animation: barEq 1.4s ease-in-out infinite 0.3s; transform-origin: bottom; }
    .eq-3 { animation: barEq 0.9s ease-in-out infinite 0.2s; transform-origin: bottom; }
    .eq-4 { animation: barEq 1.6s ease-in-out infinite 0.5s; transform-origin: bottom; }
    .eq-5 { animation: barEq 1.2s ease-in-out infinite 0.15s; transform-origin: bottom; }
    .eq-6 { animation: barEq 1.5s ease-in-out infinite 0.4s; transform-origin: bottom; }
  ]]>
  </style>

  <!-- Background Base -->
  <rect width="920" height="350" fill="url(#d2-bg)"/>
  <rect width="920" height="350" fill="url(#d2-grid)"/>
  <rect width="920" height="350" fill="url(#hex-dot-matrix)"/>

  <!-- Deep Crimson Celestial Nebula Haze -->
  <circle cx="720" cy="145" r="220" fill="url(#crimson-nebula)"/>
  <circle cx="360" cy="180" r="180" fill="url(#crimson-nebula)" opacity="0.4"/>

  <!-- ================= PROGRAMMATIC MEMORY/HEX DUMP WATERFALL ================= -->
  <g fill="#e11d48" opacity="0.14" font-size="7.5" letter-spacing="1">
    <text x="520" y="50">0x7FFF80 48 89 E5 48 83 EC 20</text>
    <text x="520" y="66">0x7FFF88 48 8D 3D 00 00 00 00</text>
    <text x="520" y="82">0x7FFF90 E8 00 00 00 00 B8 00</text>
    <text x="520" y="98">0x7FFF98 C9 C3 90 90 55 48 89</text>
    <text x="520" y="114">0x7FFFA0 0xVOID_CYCLE::INIT</text>
    <text x="520" y="130">0x7FFFA8 0xFFE4 JMP RAX [SYNC]</text>
  </g>

  <g fill="#ffffff" opacity="0.08" font-size="7" letter-spacing="1.2">
    <text x="360" y="52">fn kernel_exec() -&gt; Result&lt;Void&gt; {</text>
    <text x="360" y="68">  let core = celestial::bind(0xHYZEN);</text>
    <text x="360" y="84">  core.stream_frequency(432.0);</text>
    <text x="360" y="100">  unsafe { mem::transmute(ECLIPSE) }</text>
    <text x="360" y="116">}</text>
  </g>

  <!-- Stars Layer -->
  <g fill="#ffffff">
    <circle cx="70" cy="48" r="0.9" opacity="0.5"/>
    <circle cx="140" cy="90" r="1.3" class="star-a" filter="url(#white-soft)"/>
    <circle cx="210" cy="40" r="0.8" opacity="0.4"/>
    <circle cx="320" cy="75" r="1.2" class="star-b" filter="url(#white-soft)"/>
    <circle cx="460" cy="35" r="0.7" opacity="0.6"/>
    <circle cx="610" cy="65" r="1.4" class="star-c" filter="url(#white-soft)"/>
    <circle cx="840" cy="45" r="0.8" opacity="0.4"/>
    <circle cx="875" cy="110" r="1.1" class="star-a"/>
  </g>

  <!-- Crimson Constellation Lines -->
  <g stroke="#e11d48" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="2,3" fill="none">
    <polyline points="70,48 140,90 210,40"/>
    <polyline points="610,65 670,35 730,50"/>
  </g>

  <!-- Ethereal Anime Ink Clouds (Monochrome with dark crimson undertone) -->
  <g fill="#ffffff" opacity="0.05">
    <path d="M560,250 C580,215 625,210 650,225 C680,195 730,190 760,215 C790,185 845,200 865,240 L530,280 Z"/>
    <path d="M600,270 C625,245 660,245 680,258 C705,238 750,232 775,255 L580,295 Z" opacity="0.6"/>
  </g>

  <!-- ================= ECLIPSE BLOOD MOON (Image 1 evolved with crimson user request) ================= -->
  <g transform="translate(710, 140)">
    <!-- Crimson Orbit Aura Rings -->
    <circle cx="15" cy="5" r="82" fill="none" stroke="#be123c" stroke-width="0.8" stroke-dasharray="4, 8" opacity="0.35" class="moon-core"/>
    <circle cx="15" cy="5" r="96" fill="none" stroke="#e11d48" stroke-width="0.5" stroke-dasharray="2, 14" opacity="0.4"/>

    <!-- Crescent Crimson Halo (Outer Glow) -->
    <path d="M 45 -65 A 80 80 0 1 0 55 85 A 66 66 0 1 1 45 -65 Z"
          fill="#e11d48"
          opacity="0.35"
          filter="url(#crimson-glow)"
          class="moon-core"/>

    <!-- Crescent Moon Main Body -->
    <path d="M 45 -65 A 80 80 0 1 0 55 85 A 66 66 0 1 1 45 -65 Z"
          fill="url(#blood-moon-grad)"
          filter="url(#white-soft)"/>

    <!-- Crater Texture / Dark Crimson shadows -->
    <g fill="#4c0519" opacity="0.45">
      <circle cx="-32" cy="6" r="6"/>
      <circle cx="-40" cy="-20" r="4.5"/>
      <circle cx="-16" cy="36" r="5"/>
      <circle cx="-45" cy="18" r="3"/>
    </g>

    <!-- Programmatic Targeting Reticle Axis -->
    <line x1="-72" y1="5" x2="-62" y2="5" stroke="#e11d48" stroke-width="1.2" opacity="0.9"/>
    <line x1="15" y1="-82" x2="15" y2="-72" stroke="#e11d48" stroke-width="1.2" opacity="0.9"/>
    <circle cx="15" cy="5" r="2.5" fill="#e11d48"/>
  </g>

  <!-- Floating Crimson Energy Embers -->
  <g fill="#e11d48">
    <circle cx="730" cy="180" r="1.5" class="ember-1" filter="url(#crimson-glow)"/>
    <circle cx="700" cy="150" r="1.2" class="ember-2"/>
    <circle cx="755" cy="130" r="1.8" class="ember-3" filter="url(#crimson-glow)"/>
    <circle cx="680" cy="200" r="1.2" class="ember-1"/>
  </g>

  <!-- ================= FLOATING PROGRAMMATIC PORTAL CUBES ================= -->
  <!-- Cube 1: Large Center-Left Frame with Crimson Corner Accents -->
  <g class="cube-1">
    <rect x="620" y="150" width="56" height="56" fill="#0c0407" fill-opacity="0.6" stroke="#ffffff" stroke-width="1.6" filter="url(#white-soft)"/>
    <rect x="626" y="156" width="44" height="44" fill="none" stroke="#e11d48" stroke-width="0.8" stroke-dasharray="4, 2" opacity="0.85"/>
    <!-- Wireframe Isometric Depth lines -->
    <line x1="620" y1="150" x2="630" y2="140" stroke="#be123c" stroke-width="1"/>
    <line x1="676" y1="150" x2="686" y2="140" stroke="#be123c" stroke-width="1"/>
    <line x1="676" y1="206" x2="686" y2="196" stroke="#be123c" stroke-width="1"/>
    <line x1="630" y1="140" x2="686" y2="140" stroke="#be123c" stroke-width="1"/>
    <line x1="686" y1="140" x2="686" y2="196" stroke="#be123c" stroke-width="1"/>
    <!-- Programmatic Telemetry Tag -->
    <text x="622" y="134" font-size="7.5" fill="#e11d48" font-weight="700" letter-spacing="1">REG::0xFA_VOID</text>
  </g>

  <!-- Cube 2: Bottom-Right Medium Wireframe Box -->
  <g class="cube-2">
    <rect x="765" y="205" width="46" height="46" fill="#080306" stroke="#e11d48" stroke-width="1.5" filter="url(#crimson-glow)"/>
    <rect x="772" y="212" width="32" height="32" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    <circle cx="788" cy="228" r="2.5" fill="#e11d48"/>
    <text x="765" y="263" font-size="7" fill="#fda4af" letter-spacing="1">MEM::ALLOC [OK]</text>
  </g>

  <!-- Cube 3: High Precision Diamond Anchor -->
  <g class="cube-3">
    <rect x="730" y="70" width="32" height="32" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
    <line x1="730" y1="86" x2="762" y2="86" stroke="#e11d48" stroke-width="0.8" stroke-dasharray="2, 2"/>
    <line x1="746" y1="70" x2="746" y2="102" stroke="#e11d48" stroke-width="0.8" stroke-dasharray="2, 2"/>
  </g>

  <!-- Distant Tilted Floating Frames -->
  <g transform="translate(825, 130) rotate(22)">
    <rect x="0" y="0" width="18" height="18" fill="none" stroke="#e11d48" stroke-width="1" opacity="0.75"/>
  </g>
  <g transform="translate(575, 195) rotate(-15)">
    <rect x="0" y="0" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- ================= LEFT HERO: PROGRAMMATIC KERNEL & HUD ================= -->
  <!-- Top System Bar / IDE Header -->
  <g transform="translate(45, 46)">
    <!-- Status Dot (Glowing Crimson) -->
    <circle cx="4" cy="4" r="3.5" fill="#e11d48" filter="url(#crimson-glow)"/>
    <circle cx="4" cy="4" r="7" fill="none" stroke="#e11d48" stroke-width="0.8" opacity="0.5"/>
    <text x="18" y="7" font-size="9" fill="#fecdd3" font-weight="700" letter-spacing="2">KERNEL::ECLIPSE-OS [0xHYZEN]</text>
    <text x="260" y="7" font-size="8.5" fill="#e11d48" letter-spacing="1.5">● RUNNING</text>
    <text x="345" y="7" font-size="8.5" fill="#64748b" letter-spacing="1.5">LATENCY: 0.08ms</text>
    <text x="475" y="7" font-size="8.5" fill="#94a3b8" letter-spacing="1.5">CPU: PARALLEL</text>
  </g>

  <!-- Programmatic Window / Compiler Bracket Framing -->
  <g stroke="#e11d48" stroke-width="1.2" opacity="0.65" fill="none">
    <path d="M 42,70 L 42,62 L 60,62"/>
    <path d="M 480,62 L 498,62 L 498,70"/>
    <path d="M 42,220 L 42,228 L 60,228"/>
    <path d="M 480,228 L 498,228 L 498,220"/>
  </g>

  <!-- Glitch Crimson Shadow Layer -->
  <text x="47" y="142" font-size="54" font-weight="900" fill="#e11d48" letter-spacing="6" class="glitch-red-shadow">
    HYZENVAL
  </text>

  <!-- Main Hero Title (Crisp Titanium White) -->
  <text x="45" y="142" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#white-soft)">
    HYZENVAL
  </text>

  <!-- Programmatic Subtitle / Kernel Spec -->
  <g transform="translate(48, 172)">
    <rect x="0" y="-12" width="94" height="17" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-width="0.8" rx="2"/>
    <text x="6" y="0" font-size="8.5" font-weight="700" fill="#ff4d6d" letter-spacing="1.5">SYS.ARCHITECT</text>
    <text x="105" y="0" font-size="11.5" fill="#cbd5e1" font-weight="500" letter-spacing="2.8">
      LOW-LEVEL SYSTEMS <tspan fill="#e11d48">::</tspan> CREATIVE COMPUTING
    </text>
  </g>

  <!-- Interactive Terminal Instruction Line -->
  <g transform="translate(48, 206)">
    <text x="0" y="0" font-size="10" fill="#94a3b8">
      <tspan fill="#e11d48" font-weight="700">&gt;&gt;&gt;</tspan>
      <tspan fill="#fda4af"> void.alloc</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#cbd5e1">0xHYZEN</tspan><tspan fill="#ffffff">)</tspan>
      <tspan fill="#94a3b8">.spawn_thread</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#ff4d6d">"transcend_reality"</tspan><tspan fill="#ffffff">)</tspan>
      <tspan fill="#e11d48" class="term-cursor" font-weight="900">_</tspan>
    </text>
  </g>

  <!-- ================= BOTTOM TELEMETRY DOCK ================= -->
  <!-- Frequency EQ Bars (Crimson to White) -->
  <g transform="translate(48, 288)">
    <rect x="0" y="-16" width="3.5" height="16" fill="url(#bar-crimson)" class="eq-1"/>
    <rect x="6" y="-22" width="3.5" height="22" fill="url(#bar-crimson)" class="eq-2"/>
    <rect x="12" y="-12" width="3.5" height="12" fill="url(#bar-crimson)" class="eq-3"/>
    <rect x="18" y="-28" width="3.5" height="28" fill="url(#bar-crimson)" class="eq-4"/>
    <rect x="24" y="-15" width="3.5" height="15" fill="url(#bar-crimson)" class="eq-5"/>
    <rect x="30" y="-20" width="3.5" height="20" fill="url(#bar-crimson)" class="eq-6"/>
    <rect x="36" y="-10" width="3.5" height="10" fill="url(#bar-crimson)" class="eq-2"/>
    <rect x="42" y="-24" width="3.5" height="24" fill="url(#bar-crimson)" class="eq-4"/>
    <rect x="48" y="-14" width="3.5" height="14" fill="url(#bar-crimson)" class="eq-1"/>
    <rect x="54" y="-18" width="3.5" height="18" fill="url(#bar-crimson)" class="eq-5"/>
    <text x="68" y="-4" font-size="8" fill="#fda4af" letter-spacing="1.5">RESONANCE // 432 Hz SYNC</text>
  </g>

  <!-- Crimson Radar Reticle -->
  <g transform="translate(255, 282)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#be123c" stroke-width="0.8" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#e11d48" stroke-width="0.5" stroke-dasharray="2, 2" opacity="0.35"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#be123c" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#be123c" stroke-width="0.5" opacity="0.3"/>
    <!-- Sweeping Line -->
    <g class="radar-rot">
      <line x1="0" y1="0" x2="14" y2="-6" stroke="#ffffff" stroke-width="1.4" filter="url(#crimson-glow)"/>
    </g>
    <circle cx="7" cy="-5" r="1.5" fill="#ff4d6d" filter="url(#crimson-glow)"/>
    <text x="24" y="3" font-size="8" fill="#e11d48" letter-spacing="1.5">TARGET // ACQUIRED</text>
  </g>

  <!-- Register Telemetry (Right) -->
  <g transform="translate(710, 308)">
    <text x="0" y="0" font-size="8" fill="#fda4af" letter-spacing="1.5">
      RAX: 0xVOID | RBX: 0xHYZEN
    </text>
    <text x="0" y="14" font-size="7.5" fill="#881337" letter-spacing="2">
      PROTOCOL: AFERA-XV // KERNEL.RED
    </text>
  </g>

  <!-- Laser Scanline with Crimson Chromatic Bleed -->
  <line x1="0" y1="0" x2="920" y2="0" stroke="url(#laser-red)" stroke-width="1.2" class="scan-beam" filter="url(#crimson-glow)"/>

  <!-- Programmatic Outer Shell / Chassis -->
  <rect x="1.5" y="1.5" width="917" height="347" fill="none" stroke="#e11d48" stroke-width="0.8" stroke-opacity="0.25" rx="6"/>
  <!-- Corner Tech Notch Accents -->
  <line x1="14" y1="8" x2="32" y2="8" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
  <line x1="8" y1="14" x2="8" y2="32" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
  <line x1="906" y1="8" x2="888" y2="8" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
  <line x1="912" y1="14" x2="912" y2="32" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
  <line x1="14" y1="342" x2="32" y2="342" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
  <line x1="8" y1="336" x2="8" y2="318" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
  <line x1="906" y1="342" x2="888" y2="342" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
  <line x1="912" y1="336" x2="912" y2="318" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
</svg>
