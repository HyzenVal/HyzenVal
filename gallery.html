<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyzenVal Profile Theme Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06070a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 24px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .tabs {
      display: flex;
      gap: 12px;
    }
    .tab-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 10px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: #1e293b;
      color: #fff;
    }
    .tab-btn.active-1 {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }
    .tab-btn.active-2 {
      background: #e11d48;
      color: #ffffff;
      border-color: #ff4d6d;
      box-shadow: 0 0 18px rgba(225, 29, 72, 0.5);
    }
    .preview-frame {
      width: 100%;
      height: 85vh;
      border: 1px solid #1e293b;
      border-radius: 8px;
      background: #0d1117;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="brand">HYZENVAL // GITHUB PROFILE SUITE</div>
    <div class="tabs">
      <button id="btn1" class="tab-btn" onclick="selectTheme(1)">Design 1 // Celestial Monochrome</button>
      <button id="btn2" class="tab-btn active-2" onclick="selectTheme(2)">Design 2 // Crimson Kernel Eclipse</button>
    </div>
  </div>

  <iframe id="viewer" class="preview-frame" src="./Design 2/preview.html"></iframe>

  <script>
    function selectTheme(num) {
      const viewer = document.getElementById('viewer');
      const b1 = document.getElementById('btn1');
      const b2 = document.getElementById('btn2');

      if (num === 1) {
        viewer.src = './Design 1/preview.html';
        b1.className = 'tab-btn active-1';
        b2.className = 'tab-btn';
      } else {
        viewer.src = './Design 2/preview.html';
        b1.className = 'tab-btn';
        b2.className = 'tab-btn active-2';
      }
    }
  </script>
</body>
</html>
