name: Generate Crimson Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HyzenVal
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff1744&color_dots=#140409,#4c0519,#881337,#be123c,#ff1744
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff1744&color_dots=#140409,#4c0519,#881337,#be123c,#ff1744

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

