<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="div-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCenter {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .div-center {
      transform-origin: 450px 12px;
      animation: pulseCenter 3s ease-in-out infinite;
    }
  </style>

  <!-- Main glowing line -->
  <line x1="60" y1="12" x2="840" y2="12" stroke="url(#div-grad)" stroke-width="1"/>

  <!-- Secondary subtle tick marks -->
  <line x1="380" y1="8" x2="380" y2="16" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
  <line x1="520" y1="8" x2="520" y2="16" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>

  <!-- Center Diamond & Floating Frame -->
  <g class="div-center">
    <rect x="445" y="7" width="10" height="10" transform="rotate(45 450 12)" fill="#090d16" stroke="#ffffff" stroke-width="1.2" filter="url(#div-glow)"/>
    <circle cx="450" cy="12" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Left / Right Geometric brackets -->
  <polygon points="50,12 40,8 40,16" fill="#ffffff" opacity="0.4"/>
  <polygon points="850,12 860,8 860,16" fill="#ffffff" opacity="0.4"/>
</svg>

